<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Vellum</title>
  </head>
  <body>
    <div id="app">
      <header>
        <img src="assets/icon.png" alt="" class="app-logo" />
        <input type="search" id="search-input" placeholder="Search screenshots…" autocomplete="off" />
        <div class="header-actions">
          <button id="capture-btn" class="btn btn-primary" title="Capture a region (⌘⇧1)">
            Capture region
          </button>
          <button id="full-capture-btn" class="btn btn-secondary" title="Capture full screen (⌘⇧2)">
            Full screen
          </button>
          <button id="settings-btn" class="btn-icon btn-icon-header" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
            </svg>
          </button>
        </div>
      </header>

      <main>
        <div id="empty-state" class="empty-state" style="display: none;"></div>
        <div id="screenshots-grid" class="screenshots-grid" style="display: none;"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="settings-overlay">
      <div class="settings-panel">
        <div class="settings-header">
          <h2>Settings</h2>
          <button id="close-settings-btn" class="btn-icon" title="Close" aria-label="Close">✕</button>
        </div>
        <div class="settings-body">
          <div class="settings-field">
            <label for="provider-select">AI Provider</label>
            <select id="provider-select">
              <option value="openrouter">OpenRouter (cloud)</option>
              <option value="local">Local (bundled Gemma)</option>
            </select>
          </div>

          <div id="openrouter-section">
            <div id="settings-hint" class="settings-hint">
              Add your OpenRouter API key to enable AI analysis. Get one at
              <a href="#" id="openrouter-link">openrouter.ai/keys</a>.
            </div>
            <div class="settings-field">
              <label for="api-key-input">OpenRouter API Key</label>
              <input
                type="password"
                id="api-key-input"
                placeholder="sk-or-v1-..."
                autocomplete="off"
              />
            </div>
            <div class="settings-field">
              <label for="model-select">AI Model</label>
              <select id="model-select">
                <option value="google/gemini-2.5-flash-lite">Gemini 2.5 Flash Lite — fastest</option>
                <option value="google/gemini-2.5-pro">Gemini 2.5 Pro — most capable</option>
                <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
              </select>
            </div>
          </div>

          <div id="local-section" style="display: none;">
            <div class="settings-hint">
              Runs Gemma 4 E4B-it (Q4) on-device via a bundled llama-server. First use downloads
              ~5 GB of weights. No data leaves your computer.
            </div>
            <div class="local-llm-status">
              <div class="local-llm-row">
                <span class="local-llm-label">Model</span>
                <span id="local-model-state" class="local-llm-value">—</span>
              </div>
              <div class="local-llm-row">
                <span class="local-llm-label">Server</span>
                <span id="local-server-state" class="local-llm-value">—</span>
              </div>
              <div id="local-progress-wrap" class="local-progress" style="display: none;">
                <div class="local-progress-bar"><div id="local-progress-fill"></div></div>
                <span id="local-progress-text" class="local-progress-text"></span>
              </div>
              <div class="local-llm-actions">
                <button id="download-model-btn" class="btn btn-primary btn-sm">Download model</button>
                <button id="cancel-download-btn" class="btn btn-secondary btn-sm" style="display: none;">Cancel</button>
                <button id="stop-server-btn" class="btn btn-secondary btn-sm" style="display: none;">Stop server</button>
              </div>
            </div>
          </div>

          <div class="settings-actions">
            <button id="folder-btn" class="btn btn-secondary btn-sm">Show screenshots folder</button>
            <span class="settings-actions-spacer"></span>
            <span id="settings-status" class="settings-status"></span>
            <button id="save-settings-btn" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
